# Host master volume: 1.0 = 100%, 2.0 = 200%, 0 = mute; valid range 0..4.
# Independent of the game's own volume sliders. Restart after editing.
# 7.1 -> stereo keeps front channels at unity; old automatic 2x is retired.
audio_gain=1.0
audio_mix_version=1

# base: compatibility raster scaling. pro: game-owned 3840x2160 targets (restart required).
render_mode=base
# Internal raster targets in base mode, independent of window/fullscreen size.
# 1920x1080 (default), 2560x1440, 3840x2160. Higher sizes are experimental.
render_resolution=1920x1080

# Host presentation only; guest vblank remains 60 Hz. 0 = unlimited.
display_fps=60
display_vsync=1
